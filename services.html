<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services — Hasan Rizvee</title>
  <meta name="description" content="Services have moved to the main portfolio page.">
  <link rel="canonical" href="https://rizvee.github.io/#services">
  <meta http-equiv="refresh" content="3;url=/#services">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background-color: #080B12;
      color: #F0F2F5;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 440px; }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #C9A84C;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.03em;
    }
    p {
      color: #8B95A8;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background-color: #C9A84C;
      color: #080B12;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 200ms ease;
    }
    .btn:hover { background-color: #DFC06A; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <p class="label">// Page Moved</p>
    <h1>Services have moved.</h1>
    <p>
      The Services page is now part of the main portfolio.<br>
      Redirecting you in 3 seconds…
    </p>
    <a href="/#services" class="btn">Take Me There →</a>
  </div>
  <script>
    // JS redirect as a faster fallback alongside meta refresh
    setTimeout(function() {
      window.location.replace('/#services');
    }, 3000);
  </script>
</body>
</html>
